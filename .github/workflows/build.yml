name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the game (Visual Studio, Win32)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # The project was made with Visual Studio 2026 (toolset v145); the runner has Visual Studio 2022 (v143).
      - name: Build Debug
        run: msbuild game\OpenGL3DTemplate.sln /m /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Build Release
        run: msbuild game\OpenGL3DTemplate.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Package a playable build
        shell: pwsh
        run: |
          $out = "StealyNeal"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item game\Release\OpenGL3DTemplate.exe "$out\StealyNeal.exe"
          Copy-Item game\glut32.dll, game\*.wav -Destination $out
          Copy-Item game\models -Destination "$out\models" -Recurse
          Compress-Archive -Path "$out\*" -DestinationPath StealyNeal-Windows.zip
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: StealyNeal-Windows
          path: StealyNeal/

      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StealyNeal-Windows.zip
